<div class="slide">
    <div class="brand-corner"><span class="wordmark teal" style="font-size:13px;letter-spacing:2px"><span class="l1">ΛDΛP</span><span class="l2">SYS_</span></span></div>

    <div class="header-container">
        <h1 class="slide-title">Contexto y desafío</h1>
        <p class="slide-subtitle">Momento actual y pedido de {{cliente}}</p>
        <div class="title-rule"></div>
    </div>

    <div class="columns-container">
        <div class="card card-tecnico">
            <div class="card-inner">
                <h3 class="card-title">Desafío técnico</h3>
                <p class="card-text">{{desafio_tecnico}}</p>
            </div>
        </div>
        <div class="card card-adaptativo">
            <div class="card-inner">
                <h3 class="card-title">Desafío adaptativo</h3>
                <p class="card-text">{{desafio_adaptativo}}</p>
            </div>
        </div>
    </div>

    <div class="footer-box">
        <h3>Alcance preliminar</h3>
        <p>{{alcance}}</p>
    </div>

    <div class="page-num">{{num_pagina}}</div>
</div>
