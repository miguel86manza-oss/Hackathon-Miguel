<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Contexto y Desafío</title>
</head>
<body>
    <div class="slide slide-contexto">
        <div class="slide-header">
            <h1>Contexto y Desafío</h1>
            <p class="client-name">{{ client_name }}</p>
        </div>

        <div class="context-section">
            <h2>Momento Actual y Pedido del Cliente</h2>
            <p>{{ contexto }}</p>
        </div>

        <div class="challenge-boxes">
            <div class="challenge-box technical">
                <h3>Desafío Técnico</h3>
                <p>{{ desafio_tecnico }}</p>
            </div>
            <div class="challenge-box adaptive">
                <h3>Desafío Adaptativo</h3>
                <p>{{ desafio_adaptativo }}</p>
            </div>
        </div>
    </div>
</body>
</html>
